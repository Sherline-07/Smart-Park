# =======================================================
# Smart Park - Configuration Properties
# =======================================================

# MySQL Database Configuration
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/smart_parking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.user=root
db.password=Sherly#19

# Embedded Fallback DB (Used automatically if MySQL server is not active)
db.fallback.enabled=true
db.fallback.driver=org.h2.Driver
db.fallback.url=jdbc:h2:./smart_parking_db;MODE=MySQL;DATABASE_TO_UPPER=false;AUTO_SERVER=TRUE
db.fallback.user=sa
db.fallback.password=

# Pricing Rules (Base Rates in INR per hour)
pricing.2w.base=20.0
pricing.4w.base=40.0

# Dynamic Surge Pricing (When Occupancy > 80%)
pricing.occupancy.threshold=80.0
pricing.2w.surge=30.0
pricing.4w.surge=60.0

# Web Server Port
server.port=8080
