<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Portal — Smart Park System</title>
    <link rel="stylesheet" href="css/parking.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-cyan);
            border-radius: 24px;
            padding: 40px 35px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.15);
            animation: fadeIn 0.4s ease-out;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .auth-logo {
            font-size: 42px;
            margin-bottom: 8px;
            display: inline-block;
        }
        .auth-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #fff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .auth-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .auth-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 25px;
            border: 1px solid var(--border-glass);
        }
        .auth-tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border-radius: 9px;
            transition: all 0.25s ease;
        }
        .auth-tab-btn.active {
            background: var(--accent-cyan);
            color: #04111d;
            box-shadow: 0 0 15px var(--accent-cyan-glow);
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-cyan);
            font-size: 15px;
        }
        .form-control {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px var(--accent-cyan-glow);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-cyan), #00a8ff);
            color: #04111d;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 0 20px var(--accent-cyan-glow);
            margin-top: 10px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.6);
        }
        .auth-switch-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .auth-switch-link a {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-switch-link a:hover {
            text-decoration: underline;
        }
        .alert-box {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        .alert-error {
            background: rgba(255, 77, 77, 0.2);
            border: 1px solid rgba(255, 77, 77, 0.5);
            color: #ff8080;
        }
        .alert-success {
            background: rgba(0, 230, 118, 0.2);
            border: 1px solid rgba(0, 230, 118, 0.5);
            color: #69f0ae;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">🅿️</div>
                <div class="auth-title">SMART PARK</div>
                <div class="auth-subtitle">Customer Reservation & Daily Commuter Portal</div>
            </div>

            <!-- Tab Switcher -->
            <div class="auth-tabs">
                <button type="button" class="auth-tab-btn active" id="tabLoginBtn" onclick="switchAuthTab('login')">Sign In</button>
                <button type="button" class="auth-tab-btn" id="tabRegisterBtn" onclick="switchAuthTab('register')">Register Account</button>
            </div>

            <div id="alertBox" class="alert-box"></div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleUserLogin(event)">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="loginUsername" class="form-control" placeholder="Enter username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="loginPassword" class="form-control" placeholder="Enter password" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-right-to-bracket mr-2"></i> Log In to Customer Hub
                </button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" style="display: none;" onsubmit="handleUserRegister(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-id-card"></i>
                        <input type="text" id="regFullName" class="form-control" placeholder="e.g. Anand Verma" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="regUsername" class="form-control" placeholder="Choose a username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-key"></i>
                        <input type="password" id="regPassword" class="form-control" placeholder="Choose a password" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Phone / Contact</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" id="regPhone" class="form-control" placeholder="Mobile Number">
                    </div>
                </div>
                <div class="form-group">
                    <label>Default Vehicle Number</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-car"></i>
                        <input type="text" id="regVehicle" class="form-control" placeholder="e.g. TN01AB9999">
                    </div>
                </div>
                <div class="form-group">
                    <label>Default Vehicle Category</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-layer-group"></i>
                        <select id="regVehicleType" class="form-control" style="appearance: none;">
                            <option value="4W">Four Wheeler (4W)</option>
                            <option value="2W">Two Wheeler (2W)</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-user-plus mr-2"></i> Create Customer Account
                </button>
            </form>

            <div class="auth-switch-link">
                Operational Staff or Admin? <a href="login.html">Worker Login Portal &rarr;</a>
            </div>
        </div>
    </div>

    <script src="js/user-login.js"></script>
</body>
</html>
